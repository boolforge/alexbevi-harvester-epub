name: Build EPUB and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Monthly, in case the source series gets a correction or a new part.
    # This is a personal archival tool re-reading a public blog it has no
    # control over, so a periodic rebuild is the only way "the latest
    # version of the source" and "the latest version of the book" stay in
    # sync without someone remembering to click the button by hand.
    - cron: "17 6 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-ibm-plex fonts-jetbrains-mono

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build the EPUB
        id: build
        run: |
          set +e
          python -m harvester_epub.main -o "${{ github.workspace }}/dist/reverse-engineering-harvester-with-ghidra-and-codex.epub" -v 2>&1 | tee /tmp/build.log
          exit_code=${PIPESTATUS[0]}
          exit $exit_code
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report failure diagnostics
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          log = open('/tmp/build.log', errors='replace').read()[-5000:]
          body = f"Automated diagnostic for run {os.environ['RUN_ID']}.\n\n```\n{log}\n```"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues",
              data=json.dumps({"title": f"CI failure: run {os.environ['RUN_ID']}", "body": body}).encode(),
              headers={
                  "Authorization": f"token {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          urllib.request.urlopen(req)
          PYEOF
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble Pages site
        run: |
          mkdir -p dist
          cp site/index.html dist/index.html
          python3 -c "
          import sys; sys.path.insert(0, 'src')
          from harvester_epub import media
          open('dist/cover.png', 'wb').write(media.build_cover())
          "
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: epub
          path: dist/*.epub
          retention-days: 90

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
